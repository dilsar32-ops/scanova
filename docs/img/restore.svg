    <linearGradient id="piso" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6eaf0"/><stop offset="1" stop-color="#d5dbe5"/></linearGradient>
    <linearGradient id="vidrio" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eaf2ff"/><stop offset="1" stop-color="#d4e5fb"/></linearGradient>
    <linearGradient id="frente" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f92f9"/><stop offset=".6" stop-color="#1e6ff0"/><stop offset="1" stop-color="#0b55cc"/></linearGradient>
