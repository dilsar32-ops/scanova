    <!-- lapiz sobre la mesa -->
    <g transform="rotate(-4 660 398)">
      <rect x="570" y="391" width="180" height="13" rx="6.5" fill="url(#lapiz)" stroke="#c9d1dc" stroke-width="1"/>
      <path d="M750 391 L770 397.5 L750 404 Z" fill="#d9dfe8"/><rect x="570" y="391" width="28" height="13" rx="6.5" fill="#e3e8f0"/>
    </g>
  </g>
</svg>
