        <path d="M400 196 A18 18 0 0 1 418 214"/><path d="M470 176 A18 18 0 0 0 452 194"/><path d="M470 252 A18 18 0 0 1 488 270"/><path d="M520 240 A18 18 0 0 0 538 222"/>
      </g>
      <!-- muebles -->
      <g fill="#dde4ee" stroke="#9aa6b8" stroke-width="1.8">
        <rect x="306" y="156" width="88" height="16" rx="2"/><rect x="308" y="158" width="14" height="12" rx="1"/><rect x="340" y="158" width="18" height="12" rx="1"/>
        <rect x="306" y="176" width="16" height="30" rx="2"/>
        <rect x="306" y="241" width="40" height="18" rx="4"/><circle cx="384" cy="300" r="8"/><rect x="360" y="246" width="30" height="20" rx="2"/>
        <rect x="486" y="156" width="52" height="20" rx="3"/><circle cx="600" cy="186" r="12"/><rect x="580" y="156" width="52" height="16" rx="2"/>
        <rect x="480" y="262" width="44" height="52" rx="3"/><rect x="484" y="266" width="36" height="10" rx="2"/>
        <rect x="566" y="262" width="52" height="52" rx="3"/><rect x="570" y="266" width="44" height="10" rx="2"/>
      </g>
      <!-- nombres -->
      <g font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="11" font-weight="700" fill="#1a2130">
        <text x="306" y="226">KITCHEN</text><text x="306" y="312">BATH</text><text x="418" y="204" font-size="9">HALL</text><text x="486" y="226">LIVING ROOM</text><text x="480" y="252" font-size="9">BED 1</text><text x="566" y="252" font-size="9">BED 2</text>
      </g>
      <!-- cotas -->
      <g stroke="#0b64de" stroke-width="1.8" fill="#0b64de" font-family="Arial, sans-serif" font-size="10">
        <path d="M300 332 H640 M300 328 V336 M640 328 V336"/><text x="470" y="342" text-anchor="middle" stroke="none">32'-6"</text>
        <path d="M650 150 V320 M646 150 H654 M646 320 H654"/><text x="664" y="238" stroke="none" text-anchor="middle" transform="rotate(90 664 238)">18'-0"</text>
      </g>
